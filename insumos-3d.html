<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Insumos 3D | Marquinhos Calhas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f4f3f1; --panel:#ffffff; --fg:#202427; --muted:#58616a; --line:#e1dfdb;
  --accent:#d7141b; --stage:#d9dee2; --stage-hi:#f7f8f9; --dim:#c2410c;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181b; --panel:#1c2126; --fg:#e6eaed; --muted:#97a3ab; --line:#2f363c;
  --accent:#ef4b52; --stage:#1a1f23; --stage-hi:#2c3339; --dim:#f08a4b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181b; --panel:#1c2126; --fg:#e6eaed; --muted:#97a3ab; --line:#2f363c;
  --accent:#ef4b52; --stage:#1a1f23; --stage-hi:#2c3339; --dim:#f08a4b; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:24px 36px}
.wrap{max-width:1440px;margin:auto;display:grid;gap:20px}
.masthead{display:flex;align-items:center;gap:24px;padding:0 4px 17px;border-bottom:1px solid var(--line)}
.brand{position:relative;width:154px;height:55px;overflow:hidden;flex:none}
.brand img{position:absolute;width:100%;height:auto;top:50%;transform:translateY(-50%)}
:root[data-theme="dark"] .brand{background:#fff;border-radius:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand{background:#fff;border-radius:8px}}
.eyebrow{margin:0 0 4px;color:var(--accent);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
h1{margin:0;font-size:clamp(22px,2.5vw,34px);font-weight:600;letter-spacing:-.04em;line-height:1.1}
.sub{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
.sub a{color:var(--accent)}
.grid{display:grid;grid-template-columns:216px minmax(0,1fr) 292px;gap:16px;align-items:start}
.catalog,.viewer,.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.catalog{padding:14px 9px 9px}
.catalog h2{margin:0 7px 10px;font-size:14px}
.tabs{display:grid;gap:2px}
.tabs button{display:flex;align-items:baseline;gap:9px;width:100%;padding:9px 8px;border:0;border-radius:7px;background:transparent;color:var(--fg);text-align:left;font:500 13px/1.3 var(--sans);cursor:pointer}
.tabs button:hover{background:var(--bg)}
.tabs button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 12%,var(--panel));font-weight:600}
.tabs .piece-index{flex:none;color:var(--muted);font:500 10px var(--mono)}
.tabs button[aria-pressed="true"] .piece-index{color:var(--accent)}
.viewer{overflow:hidden}
.viewer-title{padding:16px 18px 14px}
.viewer-title h2{margin:0;font-size:clamp(20px,2.3vw,27px);line-height:1.12;letter-spacing:-.03em;font-weight:600}
.viewer-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-block:1px solid var(--line);background:var(--bg)}
.stage{position:relative;background:radial-gradient(120% 100% at 50% 28%,var(--stage-hi),var(--stage));height:clamp(390px,58vh,650px);overflow:hidden}
#c{display:block;width:100%;height:100%;position:absolute;inset:0}
.watermark{position:absolute;inset:0;width:100%;height:100%;opacity:.06;pointer-events:none;user-select:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .watermark{filter:brightness(0) invert(1);opacity:.05}}
:root[data-theme="dark"] .watermark{filter:brightness(0) invert(1);opacity:.05}
.hint{margin:0;padding:10px 13px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.4}
.views,.mode{display:flex;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:9px}
.views button,.mode button{min-height:32px;font:500 12px var(--sans);background:transparent;color:var(--fg);border:0;border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.views button:hover,.mode button:hover{background:var(--bg)}
.views button[aria-pressed="true"],.mode button[aria-pressed="true"]{background:#c9131b;color:#fff}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{padding:14px 16px}
.lbl{font-size:14px;color:var(--fg);margin:0 0 10px;font-weight:600}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12px;color:var(--muted)}
.f input{font:500 15px var(--mono);padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);width:100%;font-variant-numeric:tabular-nums}
.f input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.res{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin:0}
.res dt{color:var(--muted)} .res dd{margin:0;font:600 14px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.res .big{font-size:18px;color:var(--accent)}
.app{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.app + .app{margin-top:8px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:1099px){.grid{grid-template-columns:minmax(0,1fr) 278px}.catalog{grid-column:1/-1}}
@media(max-width:670px){
  body{padding-block:14px 24px;padding-inline:12px}
  .wrap,.grid{gap:12px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .masthead{gap:13px;padding:0 0 12px}
  .brand{width:106px;height:43px}
  .masthead .sub{display:none}
  .stage{height:clamp(290px,52svh,430px)}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="masthead">
    <div class="brand"><img src="/marca-marquinhos.png" alt="Marquinhos Calhas e Esquadrias" width="1000" height="700"></div>
    <div>
      <p class="eyebrow">Marquinhos Calhas e Esquadrias</p>
      <h1>Insumos 3D</h1>
      <p class="sub">Materiais de vedação e fixação usados na instalação. <a href="/pecas-3d.html">Ver peças dobradas ↗</a></p>
    </div>
  </header>
  <div class="grid">
    <aside class="catalog" aria-label="Insumos">
      <h2>Escolha um insumo</h2>
      <nav class="tabs" id="tabs" aria-label="Insumos"></nav>
    </aside>
    <section class="viewer" aria-labelledby="item-title">
      <div class="viewer-title">
        <p class="eyebrow" id="item-index"></p>
        <h2 id="item-title" aria-live="polite"></h2>
      </div>
      <div class="viewer-toolbar">
        <div class="mode" id="mode" role="group" aria-label="Exibição">
          <button type="button" data-m="peca" aria-pressed="true">Sachê</button><button type="button" data-m="obra" aria-pressed="false">Na obra</button>
        </div>
        <div class="views" role="group" aria-label="Ângulo de visualização">
          <button type="button" id="vIso" aria-pressed="true">3D</button><button type="button" id="vSide" aria-pressed="false">Lateral</button>
        </div>
      </div>
      <div class="stage">
        <canvas id="c"></canvas>
        <svg class="watermark" aria-hidden="true" focusable="false">
          <defs>
            <pattern id="wm" width="176" height="216" patternUnits="userSpaceOnUse">
              <image href="/marca-marquinhos.png" x="6" y="23" width="88" height="62" transform="rotate(-10 50 54)" />
              <image href="/marca-marquinhos.png" x="82" y="131" width="88" height="62" transform="rotate(-10 126 162)" />
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#wm)" />
        </svg>
      </div>
      <p class="hint">Arraste para girar. Use a rolagem ou a pinça para aproximar.</p>
    </section>
    <div class="side">
      <div class="card">
        <h3 class="lbl">Medidas <span class="sub">(cm)</span></h3>
        <div class="fields" id="fields"></div>
      </div>
      <div class="card">
        <h3 class="lbl">Aplicação na obra</h3>
        <p class="app" id="app"></p>
        <p class="app" id="app2"></p>
      </div>
      <div class="card">
        <h3 class="lbl">Resumo</h3>
        <dl class="res">
          <dt>Embalagem</dt><dd id="rEmb">–</dd>
          <dt>Volume aproximado</dt><dd class="big" id="rVol">–</dd>
          <dt>Unidade no orçamento</dt><dd id="rUn">–</dd>
        </dl>
      </div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
const $=id=>document.getElementById(id);
const fmt=(v,d=0)=>v.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});

/* Insumos: cada um tem campos editáveis (cm), textos e o modelo 3D. */
const ITEMS={
  "tubo-pu-ms40":{
    code:"21",
    nome:"Tubo Vedante PU MS40",
    emb:"Sachê (salsicha)",
    un:"tubo",
    campos:[["len","Comprimento",30],["dia","Diâmetro",5]],
    app:"Selante usado na vedação de emendas, cabeceiras, bocais e encontros de calhas, rufos e pingadeiras com a alvenaria.",
    app2:"Aplicado com pistola para sachê: corta-se uma ponta do sachê e o cordão é puxado sobre a emenda já rebitada.",
    modo:"Sachê",
    model:(v)=>sachet(v.len,v.dia),
    vol:(v)=>{const R=v.dia/2,e=Math.min(R*1.15,v.len*0.18);return Math.PI*R*R*(v.len-2*e)+2*(Math.PI*e/3)*(R*R+R*R*0.13+R*R*0.0169)},
  },
  "tubo-silicone":{
    code:"22",
    nome:"Tubo de Silicone",
    emb:"Cartucho com bico",
    un:"unidade",
    campos:[["len","Comprimento",21.5],["dia","Diâmetro",4.8]],
    app:"Silicone para acabamento e vedação de pequenas frestas, encontros de rufos e pingadeiras com a alvenaria e fixação de peças leves.",
    app2:"Rosqueia-se o bico no cartucho, corta-se a ponta do bico no diâmetro do cordão e aplica-se com pistola comum de cartucho.",
    modo:"Cartucho",
    model:(v)=>cartridge(v.len,v.dia),
    vol:(v)=>{const r=v.dia/2-0.15;return Math.PI*r*r*Math.max(0,v.len-2.2)},
  },
};
const ORDER=Object.keys(ITEMS);
let cur=Object.hasOwn(ITEMS,location.hash.slice(1))?location.hash.slice(1):ORDER[0];
let mode="peca", vmode="iso", moved=false;

/* ── Three.js ── */
const canvas=$("c"), stage=canvas.parentElement;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.82;
const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new THREE.RoomEnvironment(),0.04).texture;
const cam=new THREE.PerspectiveCamera(32,1,0.1,2000);
const ctl=new THREE.OrbitControls(cam,canvas);
ctl.enableDamping=true;ctl.dampingFactor=0.12;
ctl.addEventListener("start",()=>{moved=true});
ctl.addEventListener("change",requestDraw);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a9096,0.55));
const key=new THREE.DirectionalLight(0xffffff,0.9);key.position.set(30,60,40);scene.add(key);
const group=new THREE.Group();scene.add(group);
const center=new THREE.Vector3();let radius=1;const bsize=new THREE.Vector3();

const M={
  foil:new THREE.MeshStandardMaterial({color:0x50555a,metalness:0.55,roughness:0.32,envMapIntensity:0.85}),
  clip:new THREE.MeshStandardMaterial({color:0x4d5257,metalness:0.85,roughness:0.35}),
  sheet:new THREE.MeshStandardMaterial({color:0x9aa3aa,metalness:0.45,roughness:0.42,side:THREE.DoubleSide,envMapIntensity:0.6}),
  sheet2:new THREE.MeshStandardMaterial({color:0xb4bcc2,metalness:0.4,roughness:0.45,side:THREE.DoubleSide,envMapIntensity:0.6}),
  tube:new THREE.MeshStandardMaterial({color:0x4f555b,metalness:0.35,roughness:0.3,envMapIntensity:0.6,side:THREE.DoubleSide}),
  tube2:new THREE.MeshStandardMaterial({color:0x43494e,metalness:0.35,roughness:0.38,envMapIntensity:0.6,side:THREE.DoubleSide}),
  dark:new THREE.MeshStandardMaterial({color:0x2c3034,roughness:0.8,side:THREE.DoubleSide}),
  bead:new THREE.MeshStandardMaterial({color:0x3e4348,metalness:0.05,roughness:0.6}),
  rivet:new THREE.MeshStandardMaterial({color:0xdfe3e6,metalness:0.9,roughness:0.25}),
  wall:new THREE.MeshStandardMaterial({color:0xc9c3b8,roughness:0.95,envMapIntensity:0.5}),
};

/* Sachê: superfície paramétrica deitada no eixo X.
   Corpo cilíndrico; nas pontas a película franze (pregas) e afunila até o grampo. */
function sachet(len,dia){
  const g=new THREE.Group();
  const R=dia/2, endL=Math.min(R*1.15,len*0.18), body=len-2*endL, rN=R*0.13;
  const NU=160, NV=96, pleats=11, pos=[], idx=[];
  for(let i=0;i<=NU;i++){
    const u=i/NU, x=-len/2+u*len;
    const d=Math.abs(x)-body/2;               // >0 dentro da ponta
    const t=Math.max(0,Math.min(1,d/endL));   // 0 corpo → 1 grampo
    const base=rN+(R-rN)*Math.cos(t*Math.PI/2)**1.25;
    const amp=Math.sin(t*Math.PI)**0.9*0.11;  // pregas mais fortes no meio da ponta
    for(let j=0;j<=NV;j++){
      const th=j/NV*Math.PI*2;
      const r=base*(1+amp*Math.cos(pleats*th+t*1.7)-amp*0.4);
      pos.push(x,r*Math.cos(th),r*Math.sin(th));
    }
  }
  for(let i=0;i<NU;i++)for(let j=0;j<NV;j++){
    const a=i*(NV+1)+j,b=a+NV+1;idx.push(a,b,a+1,b,b+1,a+1);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  geo.setIndex(idx);geo.computeVertexNormals();
  g.add(new THREE.Mesh(geo,M.foil));
  // grampos metálicos nas duas pontas
  for(const s of[-1,1]){
    const cl=new THREE.Mesh(new THREE.CylinderGeometry(rN*1.25,rN*1.25,R*0.55,28),M.clip);
    cl.rotation.z=Math.PI/2;cl.position.x=s*(len/2+R*0.22);g.add(cl);
    const cap=new THREE.Mesh(new THREE.SphereGeometry(rN*1.25,20,12,0,Math.PI*2,0,Math.PI/2),M.clip);
    cap.rotation.z=-s*Math.PI/2;cap.position.x=s*(len/2+R*0.495);g.add(cap);
  }
  return g;
}

/* Cartucho: corpo cilíndrico com bordas, ombro e bico rosqueado na frente (-X); bico cônico solto ao lado. */
function cartridge(len,dia){
  const g=new THREE.Group(),R=dia/2;
  const body=new THREE.Mesh(new THREE.CylinderGeometry(R,R,len,64,1,true),M.tube);
  body.rotation.z=Math.PI/2;g.add(body);
  for(const s of[-1,1]){
    const rim=new THREE.Mesh(new THREE.TorusGeometry(R*1.01,R*0.06,12,64),M.tube);
    rim.rotation.y=Math.PI/2;rim.position.x=s*(len/2-R*0.06);g.add(rim);
  }
  // fundo (êmbolo levemente recuado)
  const back=new THREE.Mesh(new THREE.CircleGeometry(R*0.97,64),M.tube2);
  back.rotation.y=Math.PI/2;back.position.x=len/2-R*0.18;g.add(back);
  // ombro da frente
  const front=new THREE.Mesh(new THREE.CylinderGeometry(R*0.98,R*0.98,R*0.08,64),M.tube2);
  front.rotation.z=Math.PI/2;front.position.x=-len/2+R*0.04;g.add(front);
  // bico rosqueado
  const nl=R*0.95,nr=R*0.36,x0=-len/2;
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(nr,nr,nl,40),M.tube);
  neck.rotation.z=Math.PI/2;neck.position.x=x0-nl/2;g.add(neck);
  for(let k=0;k<5;k++){
    const th=new THREE.Mesh(new THREE.TorusGeometry(nr*1.02,nr*0.13,10,40),M.tube);
    th.rotation.y=Math.PI/2;th.position.x=x0-nl*(0.22+k*0.17);g.add(th);
  }
  const hole=new THREE.Mesh(new THREE.CircleGeometry(nr*0.62,32),M.dark);
  hole.rotation.y=-Math.PI/2;hole.position.x=x0-nl-0.01;g.add(hole);
  // bico cônico solto
  const cl=len*0.5,cone=new THREE.Group();
  const tip=new THREE.Mesh(new THREE.CylinderGeometry(R*0.09,nr*1.15,cl,40,1,true),M.tube);
  tip.position.y=cl/2;cone.add(tip);
  const collar=new THREE.Mesh(new THREE.CylinderGeometry(nr*1.32,nr*1.32,cl*0.12,40,1,true),M.tube);
  collar.position.y=cl*0.06;cone.add(collar);
  const ring=new THREE.Mesh(new THREE.RingGeometry(nr*1.0,nr*1.32,40),M.tube);
  ring.rotation.x=Math.PI/2;cone.add(ring);
  cone.rotation.z=-Math.PI/2;cone.rotation.y=-0.25;
  cone.position.set(-len/2-nl*0.4,-R*0.55,R*1.9);g.add(cone);
  return g;
}

/* Na obra: trecho de calha com emenda rebitada recebendo o cordão de PU, sachê ao lado. */
function obra(len,dia){
  const g=new THREE.Group();
  const W=12,H=10,L=70,t=0.15;
  const prof=[[-W/2,H],[-W/2,0],[W/2,0],[W/2,H+2],[W/2+1.5,H+2]];
  function calha(z0,z1,mat,off=0){
    const sg=new THREE.Group();
    for(let k=0;k<prof.length-1;k++){
      const[a,b]=[prof[k],prof[k+1]];
      const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy);
      const m=new THREE.Mesh(new THREE.BoxGeometry(l,t,z1-z0),mat);
      m.position.set((a[0]+b[0])/2,(a[1]+b[1])/2+off,(z0+z1)/2);
      m.rotation.z=Math.atan2(dy,dx);sg.add(m);
    }
    return sg;
  }
  g.add(calha(-L/2,4,M.sheet));
  g.add(calha(-2,L/2,M.sheet2,t*1.2));   // sobreposição da emenda
  // cordão de PU acompanhando o perfil na emenda
  const pts=prof.slice(0,4).map(([x,y])=>new THREE.Vector3(x*0.98,y+0.35,4));
  const curve=new THREE.CatmullRomCurve3(pts,false,"catmullrom",0.05);
  g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,80,0.45,10,false),M.bead));
  // rebites
  for(const[x,y]of[[-W/2,3],[-W/2,7],[-3,0],[3,0],[W/2,3],[W/2,7]]){
    const r=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.25,14),M.rivet);
    if(y===0)r.position.set(x,0.25,1);else{r.rotation.z=Math.PI/2;r.position.set(x+(x<0?-0.2:0.2),y,1)}
    g.add(r);
  }
  // parede de apoio
  const w=new THREE.Mesh(new THREE.BoxGeometry(2,H+8,L),M.wall);w.position.set(-W/2-1.15,(H+8)/2-2,0);g.add(w);
  const s=ITEMS[cur].model({len,dia});s.position.set(W/2+dia/2+6,dia/2-0.2,-L/4);s.rotation.y=Math.PI/2.3;g.add(s);
  return g;
}

function clear(){while(group.children.length){const c=group.children.pop();c.traverse(o=>{if(o.geometry)o.geometry.dispose()})}}
function vals(){const o={};$("fields").querySelectorAll("input").forEach(i=>{o[i.dataset.k]=Math.max(0.5,parseFloat(i.value)||0)});return o}
function update(){
  const v=vals();clear();
  group.add(mode==="obra"?obra(v.len,v.dia):ITEMS[cur].model(v));
  const box=new THREE.Box3().setFromObject(group);box.getCenter(center);box.getSize(bsize);
  radius=box.getBoundingSphere(new THREE.Sphere()).radius;
  const vol=ITEMS[cur].vol(v);
  $("rVol").textContent=fmt(Math.round(vol/10)*10)+" ml";
  refit();requestDraw();
}
function fovs(){const v=cam.fov*Math.PI/180,h=2*Math.atan(Math.tan(v/2)*cam.aspect);return[v,h]}
function place(pos,d){cam.position.copy(pos);cam.near=Math.max(0.1,d/200);cam.far=d*20;cam.updateProjectionMatrix();ctl.target.copy(center);ctl.update()}
function viewIso(){setView("iso");moved=false;const[v,h]=fovs(),d=radius/Math.sin(Math.min(v,h)/2)*(mode==="peca"&&cam.aspect>1.2?0.78:1.02);
  place(center.clone().add(new THREE.Vector3(0.55,0.45,0.75).normalize().multiplyScalar(d)),d)}
function viewSide(){setView("side");moved=false;const[v,h]=fovs(),d=Math.max(bsize.y/2/Math.tan(v/2),bsize.x/2/Math.tan(h/2))*1.15+bsize.z/2;
  place(center.clone().add(new THREE.Vector3(0,0,d)),d)}
function setView(m){vmode=m;$("vIso").setAttribute("aria-pressed",m==="iso");$("vSide").setAttribute("aria-pressed",m==="side")}
function refit(){if(!moved)(vmode==="side"?viewSide:viewIso)()}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();refit();requestDraw()}
let pending=false;
function requestDraw(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;if(ctl.update())requestDraw();renderer.render(scene,cam)})}

function renderTabs(){
  $("tabs").innerHTML="";
  for(const k of ORDER){
    const b=document.createElement("button");b.type="button";
    b.innerHTML=`<span class="piece-index">${ITEMS[k].code}</span><span></span>`;
    b.lastChild.textContent=ITEMS[k].nome;
    b.setAttribute("aria-pressed",k===cur);b.onclick=()=>{location.hash=k};
    $("tabs").appendChild(b);
  }
}
function select(k){
  cur=k;const it=ITEMS[k];
  $("item-index").textContent="Insumo "+it.code;
  $("item-title").textContent=it.nome;
  document.title=it.nome+" | Marquinhos Calhas";
  $("app").textContent=it.app;$("app2").textContent=it.app2;
  $("rEmb").textContent=it.emb;document.querySelector('#mode [data-m="peca"]').textContent=it.modo;$("rUn").textContent=it.un;
  $("fields").innerHTML="";
  for(const[kk,l,d]of it.campos){
    const f=document.createElement("div");f.className="f";
    f.innerHTML=`<label for="f-${kk}"></label><input id="f-${kk}" type="number" min="0.5" step="0.5" inputmode="decimal" data-k="${kk}" value="${d}">`;
    f.firstChild.textContent=l;f.lastChild.oninput=update;$("fields").appendChild(f);
  }
  renderTabs();moved=false;update();
}
document.querySelectorAll("#mode button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;
  document.querySelectorAll("#mode button").forEach(x=>x.setAttribute("aria-pressed",x===b));moved=false;update()});
$("vIso").onclick=viewIso;$("vSide").onclick=viewSide;
addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(Object.hasOwn(ITEMS,k)&&k!==cur)select(k)});
new ResizeObserver(resize).observe(stage);
select(cur);resize();
</script>
</body>
</html>
