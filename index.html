<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peças Dobradas 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: seletor de peças no topo, viewer 3D à esquerda, painel de medidas + corte à direita; empilha no celular */
:root{
  --bg:#eef0f1; --panel:#ffffff; --fg:#1d2327; --muted:#5d6870; --line:#d3d8db;
  --accent:#1f4fa8; --stage:#dfe3e6; --dim:#c2410c;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181b; --panel:#1c2126; --fg:#e6eaed; --muted:#97a3ab; --line:#2f363c;
  --accent:#7fa6ee; --stage:#20262b; --dim:#f08a4b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181b; --panel:#1c2126; --fg:#e6eaed; --muted:#97a3ab; --line:#2f363c;
  --accent:#7fa6ee; --stage:#20262b; --dim:#f08a4b; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:500 14px var(--sans);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:7px 14px;cursor:pointer}
.tabs button:hover{border-color:var(--accent)}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:6px;min-height:460px;overflow:hidden}
#c{display:block;width:100%;height:100%;position:absolute;inset:0}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);pointer-events:none}
.views{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.views button{font:500 12px var(--sans);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:5px 9px;cursor:pointer}
.views button:hover{border-color:var(--accent)}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:600}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12px;color:var(--muted)}
.f input{font:500 15px var(--mono);padding:7px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box;font-variant-numeric:tabular-nums}
.f input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.tag{display:inline-block;font:600 11px var(--mono);color:var(--dim);margin-right:4px}
.res{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.res dt{color:var(--muted)} .res dd{margin:0;font:600 14px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.res .big{font-size:18px;color:var(--accent)}
svg text{font-family:var(--mono)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Peças Dobradas 3D</h1>
    <span class="sub">Medidas em cm · gire com o mouse/dedo, zoom com scroll/pinça</span>
  </header>
  <nav class="tabs" id="tabs" aria-label="Peças"></nav>
  <div class="grid">
    <div class="stage">
      <canvas id="c"></canvas>
      <div class="views">
        <button id="vIso">3D</button><button id="vFront">Corte</button>
      </div>
      <div class="hint">Arrastar: girar · Botão direito: mover</div>
    </div>
    <div class="side">
      <div class="card">
        <p class="lbl">Medidas</p>
        <div class="fields" id="fields"></div>
      </div>
      <div class="card">
        <p class="lbl">Corte da peça</p>
        <svg id="sec" viewBox="0 0 320 210" width="100%" aria-label="Seção transversal com cotas"></svg>
      </div>
      <div class="card">
        <p class="lbl">Resultado</p>
        <dl class="res">
          <dt>Desenvolvimento (corte)</dt><dd class="big" id="rDev">–</dd>
          <dt>Área de chapa</dt><dd id="rArea">–</dd>
          <dt>Dobras</dt><dd id="rDob">–</dd>
        </dl>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=(v,d=1)=>v.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const rad=d=>d*Math.PI/180;
const GAP=0.4; // folga visual da bainha fechada (cm)

/* Cada peça: campos + perfil.
   segs[i] = [rótulo|null, valor que entra no desenvolvimento, normal do rótulo [nx,ny] em coords da tela (y para baixo)] */
const PIECES={
  "platibanda":{
    nome:"Calha platibanda",
    campos:[["A","Lado parede",20],["B","Fundo",25],["C","Lado frente",10],["D","Aba",5],["E","Bainha topo",1.5]],
    perfil(v){
      const pts=[],segs=[];
      if(v.E>0){pts.push([v.E*Math.sin(rad(20)),v.A-v.E*Math.cos(rad(20))]);segs.push(["E",v.E,[0.6,-0.8]])}
      pts.push([0,v.A]);segs.push(["A",v.A,[-1,0]]);
      pts.push([0,0]);segs.push(["B",v.B,[0,1]]);
      pts.push([v.B,0]);segs.push(["C",v.C,[1,0]]);
      pts.push([v.B,v.C]);
      if(v.D>0){segs.push(["D",v.D,[0,-1]]);pts.push([v.B+v.D,v.C])}
      const dob=segs.filter(s=>s[1]>0).length-1;
      return {pts,segs,dob};
    }
  },
  "agua-furtada":{
    nome:"Água furtada",
    campos:[["A","Aba esquerda",25],["B","Aba direita",25],["E","Bainha (fechada)",1],["ang","Inclinação abas (°)",30]],
    perfil(v){
      const a=rad(Math.min(v.ang,89));
      const uL=[-Math.cos(a),Math.sin(a)], uR=[Math.cos(a),Math.sin(a)];
      const nL=[Math.sin(a),Math.cos(a)], nR=[-Math.sin(a),Math.cos(a)]; // lado de cima
      const TL=[uL[0]*v.A,uL[1]*v.A], TR=[uR[0]*v.B,uR[1]*v.B];
      const add=(p,u,k)=>[p[0]+u[0]*k,p[1]+u[1]*k];
      const pts=[],segs=[];
      if(v.E>0){
        pts.push(add(add(TL,nL,GAP),uL,-v.E)); segs.push(["E",v.E,[0.3,-1]]);
        pts.push(add(TL,nL,GAP)); segs.push([null,0]);
      }
      pts.push(TL); segs.push(["A",v.A,[-0.6,0.8]]);
      pts.push([0,0]); segs.push(["B",v.B,[0.6,0.8]]);
      pts.push(TR);
      if(v.E>0){
        segs.push([null,0]); pts.push(add(TR,nR,GAP));
        segs.push(["E",v.E,[-0.3,-1]]); pts.push(add(add(TR,nR,GAP),uR,-v.E));
      }
      return {pts,segs,dob:1+(v.E>0?2:0),ang:v.ang};
    }
  },
  "coletora":{
    nome:"Calha coletora / condutora",
    campos:[["A","Lado esquerdo",10],["B","Fundo",15],["C","Lado direito",10],["E","Bainha topo (cada)",1.5]],
    perfil(v){
      const s=Math.sin(rad(20)),c=Math.cos(rad(20)),pts=[],segs=[];
      if(v.E>0){pts.push([v.E*s,v.A-v.E*c]);segs.push(["E",v.E,[0.6,-0.8]])}
      pts.push([0,v.A]);segs.push(["A",v.A,[-1,0]]);
      pts.push([0,0]);segs.push(["B",v.B,[0,1]]);
      pts.push([v.B,0]);segs.push(["C",v.C,[1,0]]);
      pts.push([v.B,v.C]);
      if(v.E>0){segs.push(["E",v.E,[-0.6,-0.8]]);pts.push([v.B-v.E*s,v.C-v.E*c])}
      return {pts,segs,dob:2+(v.E>0?2:0)};
    }
  },
  "rufo-condutor":{
    nome:"Rufo condutor",
    campos:[["A","Lado parede",15],["B","Fundo",20],["C","Lado frente",5],["E","Bainha topo",1.5]],
    perfil(v){
      const pts=[],segs=[];
      if(v.E>0){pts.push([v.E*Math.sin(rad(20)),v.A-v.E*Math.cos(rad(20))]);segs.push(["E",v.E,[0.6,-0.8]])}
      pts.push([0,v.A]);segs.push(["A",v.A,[-1,0]]);
      pts.push([0,0]);segs.push(["B",v.B,[0,1]]);
      pts.push([v.B,0]);segs.push(["C",v.C,[1,0]]);
      pts.push([v.B,v.C]);
      return {pts,segs,dob:2+(v.E>0?1:0)};
    }
  },
  "rufo-acabamento":{
    nome:"Rufo acabamento de telha",
    campos:[["A","Topo",15],["B","Lateral",15],["C","Base",12],["D","Aba frente",5],["E","Dobra final",1.5]],
    perfil(v){
      const pts=[],segs=[],H=v.B;
      if(v.D>0){pts.push([v.A+v.D*Math.sin(rad(15)),H-v.D*Math.cos(rad(15))]);segs.push(["D",v.D,[1,0]])}
      pts.push([v.A,H]);segs.push(["A",v.A,[0,-1]]);
      pts.push([0,H]);segs.push(["B",v.B,[-1,0]]);
      pts.push([0,0]);segs.push(["C",v.C,[0,1]]);
      pts.push([v.C,0]);
      if(v.E>0){segs.push(["E",v.E,[0.8,0.6]]);pts.push([v.C+v.E*Math.cos(rad(35)),v.E*Math.sin(rad(35))])}
      return {pts,segs,dob:segs.filter(s=>s[1]>0).length-1};
    }
  },
  "rufo-convencional":{
    nome:"Rufo convencional",
    campos:[["A","Aba parede",8],["B","Capa (inclinada)",20],["C","Aba frente",8],["E","Bainha topo",1.5],["ang","Caimento capa (°)",10]],
    perfil(v){
      const a=rad(Math.min(v.ang,60)),pts=[],segs=[];
      if(v.E>0){pts.push([v.E*Math.sin(rad(20)),v.A-v.E*Math.cos(rad(20))]);segs.push(["E",v.E,[0.6,-0.8]])}
      pts.push([0,v.A]);segs.push(["A",v.A,[-1,0]]);
      pts.push([0,0]);segs.push(["B",v.B,[0,-1]]);
      const P=[v.B*Math.cos(a),-v.B*Math.sin(a)];pts.push(P);
      if(v.C>0){segs.push(["C",v.C,[1,0]]);pts.push([P[0],P[1]-v.C])}
      return {pts,segs,dob:segs.filter(s=>s[1]>0).length-1};
    }
  },
  "rufo-testeira":{
    nome:"Rufo testeira",
    campos:[["A","Aba traseira",5],["B","Topo",15],["C","Testeira",20],["D","Base",10],["E","Pingadeira",4],["F","Bainha",1.5]],
    perfil(v){
      const pts=[],segs=[],H=v.C,x=v.B+v.D;
      if(v.A>0){pts.push([0,H-v.A]);segs.push(["A",v.A,[-1,0]])}
      pts.push([0,H]);segs.push(["B",v.B,[0,-1]]);
      pts.push([v.B,H]);segs.push(["C",v.C,[1,0]]);
      pts.push([v.B,0]);segs.push(["D",v.D,[0,-1]]);
      pts.push([x,0]);
      if(v.E>0){segs.push(["E",v.E,[1,0]]);pts.push([x,-v.E])}
      if(v.E>0&&v.F>0){segs.push(["F",v.F,[-0.8,0.6]]);pts.push([x-v.F*Math.sin(rad(20)),-v.E+v.F*Math.cos(rad(20))])}
      return {pts,segs,dob:segs.filter(s=>s[1]>0).length-1};
    }
  },
  "cumeeira":{
    nome:"Rufo de cumeeira",
    campos:[["A","Aba esquerda",5],["B","Água esquerda",20],["C","Água direita",20],["D","Aba direita",5],["ang","Inclinação águas (°)",25]],
    perfil(v){
      const a=rad(Math.min(v.ang,80)),c=Math.cos(a),s=Math.sin(a),pts=[],segs=[];
      const L=[-v.B*c,-v.B*s],R=[v.C*c,-v.C*s];
      if(v.A>0){pts.push([L[0],L[1]-v.A]);segs.push(["A",v.A,[-1,0]])}
      pts.push(L);segs.push(["B",v.B,[-0.5,-0.9]]);
      pts.push([0,0]);segs.push(["C",v.C,[0.5,-0.9]]);
      pts.push(R);
      if(v.D>0){segs.push(["D",v.D,[1,0]]);pts.push([R[0],R[1]-v.D])}
      return {pts,segs,dob:segs.filter(s=>s[1]>0).length-1,ang:v.ang};
    }
  },
  "pingadeira-rufo":{
    nome:"Pingadeira com rufo (degrau)",
    campos:[["A","Pingadeira",5],["B","Topo",20],["C","Degrau",8],["D","Rufo (inclinado)",12],["E","Aba frente",8],["F","Bainha pingadeira",1.5],["ang","Caimento rufo (°)",10]],
    perfil(v){
      const a=rad(Math.min(v.ang,60)),pts=[],segs=[];
      if(v.A>0&&v.F>0){pts.push([v.F*Math.sin(rad(20)),-v.A+v.F*Math.cos(rad(20))]);segs.push(["F",v.F,[0.8,0.6]])}
      if(v.A>0){pts.push([0,-v.A]);segs.push(["A",v.A,[-1,0]])}
      pts.push([0,0]);segs.push(["B",v.B,[0,-1]]);
      pts.push([v.B,0]);segs.push(["C",v.C,[1,0]]);
      pts.push([v.B,-v.C]);segs.push(["D",v.D,[0.2,-1]]);
      const P=[v.B+v.D*Math.cos(a),-v.C-v.D*Math.sin(a)];pts.push(P);
      if(v.E>0){segs.push(["E",v.E,[1,0]]);pts.push([P[0],P[1]-v.E])}
      return {pts,segs,dob:segs.filter(s=>s[1]>0).length-1};
    }
  },
  "rufo-chapeu":{
    nome:"Rufo chapéu",
    campos:[["A","Aba esquerda",12],["B","Topo",20],["C","Lateral esquerda",10],["D","Lateral direita",10],["E","Aba direita",12],["ang","Caimento abas (°)",30]],
    perfil(v){
      const a=rad(Math.min(v.ang,80)),c=Math.cos(a),s=Math.sin(a),pts=[],segs=[];
      const yR=v.C-v.D;
      if(v.A>0){pts.push([-v.A*c,-v.A*s]);segs.push(["A",v.A,[-0.5,-0.9]])}
      pts.push([0,0]);segs.push(["C",v.C,[-1,0]]);
      pts.push([0,v.C]);segs.push(["B",v.B,[0,-1]]);
      pts.push([v.B,v.C]);segs.push(["D",v.D,[1,0]]);
      pts.push([v.B,yR]);
      if(v.E>0){segs.push(["E",v.E,[0.5,-0.9]]);pts.push([v.B+v.E*c,yR-v.E*s])}
      return {pts,segs,dob:segs.filter(s=>s[1]>0).length-1};
    }
  },
  "calha-central":{
    nome:"Calha central (fundo reto)",
    campos:[["A","Aba esquerda",8],["B","Lateral esquerda",12],["C","Fundo",25],["D","Lateral direita",12],["E","Aba direita",8]],
    perfil(v){
      const pts=[],segs=[];
      if(v.A>0){pts.push([-v.A,v.B]);segs.push(["A",v.A,[0,-1]])}
      pts.push([0,v.B]);segs.push(["B",v.B,[-1,0]]);
      pts.push([0,0]);segs.push(["C",v.C,[0,1]]);
      pts.push([v.C,0]);segs.push(["D",v.D,[1,0]]);
      pts.push([v.C,v.D]);
      if(v.E>0){segs.push(["E",v.E,[0,-1]]);pts.push([v.C+v.E,v.D])}
      return {pts,segs,dob:segs.filter(s=>s[1]>0).length-1};
    }
  },
  "pingadeira":{
    nome:"Pingadeira",
    campos:[["A","Aba esquerda",4],["B","Topo (largura muro)",20],["C","Aba direita",4],["F","Bainha (cada)",1.5]],
    perfil(v){
      const s=Math.sin(rad(20)),c=Math.cos(rad(20)),pts=[],segs=[];
      if(v.A>0&&v.F>0){pts.push([v.F*s,-v.A+v.F*c]);segs.push(["F",v.F,[0.8,0.6]])}
      if(v.A>0){pts.push([0,-v.A]);segs.push(["A",v.A,[-1,0]])}
      pts.push([0,0]);segs.push(["B",v.B,[0,-1]]);
      pts.push([v.B,0]);
      if(v.C>0){segs.push(["C",v.C,[1,0]]);pts.push([v.B,-v.C])}
      if(v.C>0&&v.F>0){segs.push(["F",v.F,[-0.8,0.6]]);pts.push([v.B-v.F*s,-v.C+v.F*c])}
      return {pts,segs,dob:segs.filter(s=>s[1]>0).length-1};
    }
  },
  "pingadeira-marquise":{
    nome:"Pingadeira marquise",
    campos:[["A","Aba frente",4],["B","Topo",25],["D","Aba final",4],["F","Bainha",1.5],["ang","Inclinação aba final (°)",20]],
    perfil(v){
      const s=Math.sin(rad(20)),c=Math.cos(rad(20)),a=rad(Math.min(v.ang,89)),pts=[],segs=[];
      if(v.A>0&&v.F>0){pts.push([v.F*s,-v.A+v.F*c]);segs.push(["F",v.F,[0.8,0.6]])}
      if(v.A>0){pts.push([0,-v.A]);segs.push(["A",v.A,[-1,0]])}
      pts.push([0,0]);segs.push(["B",v.B,[0,-1]]);
      pts.push([v.B,0]);
      if(v.D>0){segs.push(["D",v.D,[0.5,-0.9]]);pts.push([v.B+v.D*Math.cos(a),-v.D*Math.sin(a)])}
      return {pts,segs,dob:segs.filter(s=>s[1]>0).length-1};
    }
  },
  "rufo-pingadeira":{
    nome:"Rufo com pingadeira",
    campos:[["A","Pingadeira",4],["B","Base",25],["C","Aba que sobe",8],["F","Bainha pingadeira",1.5],["G","Bainha topo aba",1.5]],
    perfil(v){
      const s=Math.sin(rad(20)),c=Math.cos(rad(20)),pts=[],segs=[];
      if(v.A>0&&v.F>0){pts.push([v.F*s,-v.A+v.F*c]);segs.push(["F",v.F,[0.8,0.6]])}
      if(v.A>0){pts.push([0,-v.A]);segs.push(["A",v.A,[-1,0]])}
      pts.push([0,0]);segs.push(["B",v.B,[0,1]]);
      pts.push([v.B,0]);
      if(v.C>0){segs.push(["C",v.C,[1,0]]);pts.push([v.B,v.C])}
      if(v.C>0&&v.G>0){segs.push(["G",v.G,[-0.6,-0.8]]);pts.push([v.B-v.G*s,v.C-v.G*c])}
      return {pts,segs,dob:segs.filter(s=>s[1]>0).length-1};
    }
  },
  "pingadeira-rufo-reta":{
    nome:"Pingadeira com rufo (aba reta)",
    campos:[["A","Pingadeira",4],["B","Topo",20],["C","Aba descendo",20],["F","Bainha",1.5]],
    perfil(v){
      const s=Math.sin(rad(20)),c=Math.cos(rad(20)),pts=[],segs=[];
      if(v.A>0&&v.F>0){pts.push([v.F*s,-v.A+v.F*c]);segs.push(["F",v.F,[0.8,0.6]])}
      if(v.A>0){pts.push([0,-v.A]);segs.push(["A",v.A,[-1,0]])}
      pts.push([0,0]);segs.push(["B",v.B,[0,-1]]);
      pts.push([v.B,0]);
      if(v.C>0){segs.push(["C",v.C,[1,0]]);pts.push([v.B,-v.C])}
      return {pts,segs,dob:segs.filter(s=>s[1]>0).length-1};
    }
  },
  "calha-beiral":{
    nome:"Calha de beiral",
    campos:[["A","Fundo",12],["B","Lateral traseira",15],["C","Frente degrau 1 (baixo)",5],["D","Frente degrau 2",5],["E","Frente degrau 3 (cima)",5],["S","Recuo de cada degrau",2],["T","Topo friso",3],["L","Aba friso",2],["F","Bainha friso",1.5],["G","Bainha traseira",1.5]],
    perfil(v){
      const s=Math.sin(rad(20)),c=Math.cos(rad(20)),pts=[],segs=[];
      const top=v.C+v.D+v.E, xT=-2*v.S, xL=xT-v.T;
      if(v.L>0&&v.F>0){pts.push([xL+v.F*s,top-v.L+v.F*c]);segs.push(["F",v.F,[0.8,0.6]])}
      if(v.L>0){pts.push([xL,top-v.L]);segs.push(["L",v.L,[-1,0]])}
      pts.push([xL,top]);segs.push(["T",v.T,[0,-1]]);
      pts.push([xT,top]);segs.push(["E",v.E,[1,0]]);
      pts.push([xT,v.C+v.D]);segs.push(["S",v.S,[0,-1]]);
      pts.push([-v.S,v.C+v.D]);segs.push(["D",v.D,[1,0]]);
      pts.push([-v.S,v.C]);segs.push(["S",v.S,[0,-1]]);
      pts.push([0,v.C]);segs.push(["C",v.C,[-1,0]]);
      pts.push([0,0]);segs.push(["A",v.A,[0,1]]);
      pts.push([v.A,0]);segs.push(["B",v.B,[1,0]]);
      pts.push([v.A,v.B]);
      if(v.G>0){segs.push(["G",v.G,[-0.6,-0.8]]);pts.push([v.A-v.G*s,v.B-v.G*c])}
      return {pts,segs,dob:segs.filter(s=>s[1]>0).length-1};
    }
  },
  "calha-pingadeira":{
    nome:"Calha com pingadeira",
    campos:[["A","Fundo",12],["B","Lateral traseira",15],["C","Frente degrau 1 (baixo)",5],["D","Frente degrau 2",5],["E","Frente degrau 3 (cima)",5],["S","Recuo de cada degrau",2],["T","Topo friso",3],["L","Aba friso",2],["F","Bainha friso",1.5],["P","Topo traseiro (sobre muro)",15],["Q","Pingadeira final",3],["ang","Inclinação pingadeira (°)",20]],
    perfil(v){
      const s=Math.sin(rad(20)),c=Math.cos(rad(20)),a=rad(Math.min(v.ang,89)),pts=[],segs=[];
      const top=v.C+v.D+v.E, xT=-2*v.S, xL=xT-v.T;
      if(v.L>0&&v.F>0){pts.push([xL+v.F*s,top-v.L+v.F*c]);segs.push(["F",v.F,[0.8,0.6]])}
      if(v.L>0){pts.push([xL,top-v.L]);segs.push(["L",v.L,[-1,0]])}
      pts.push([xL,top]);segs.push(["T",v.T,[0,-1]]);
      pts.push([xT,top]);segs.push(["E",v.E,[1,0]]);
      pts.push([xT,v.C+v.D]);segs.push(["S",v.S,[0,-1]]);
      pts.push([-v.S,v.C+v.D]);segs.push(["D",v.D,[1,0]]);
      pts.push([-v.S,v.C]);segs.push(["S",v.S,[0,-1]]);
      pts.push([0,v.C]);segs.push(["C",v.C,[-1,0]]);
      pts.push([0,0]);segs.push(["A",v.A,[0,1]]);
      pts.push([v.A,0]);segs.push(["B",v.B,[-1,0]]);
      pts.push([v.A,v.B]);
      if(v.P>0){segs.push(["P",v.P,[0,-1]]);pts.push([v.A+v.P,v.B])}
      if(v.P>0&&v.Q>0){segs.push(["Q",v.Q,[0.5,-0.9]]);pts.push([v.A+v.P+v.Q*Math.cos(a),v.B-v.Q*Math.sin(a)])}
      return {pts,segs,dob:segs.filter(s=>s[1]>0).length-1};
    }
  },
  "calha-central-v":{
    nome:"Calha central (fundo em V)",
    campos:[["A","Aba esquerda",8],["B","Lateral esquerda",12],["C","Fundo esquerdo",15],["D","Fundo direito",15],["E","Lateral direita",12],["G","Aba direita",8],["F","Bainha abas (cada)",1],["ang","Caimento fundo (°)",10]],
    perfil(v){
      const s=Math.sin(rad(20)),c=Math.cos(rad(20)),a=rad(Math.min(v.ang,60)),pts=[],segs=[];
      const V=[v.C*Math.cos(a),-v.C*Math.sin(a)], R=[V[0]+v.D*Math.cos(a),V[1]+v.D*Math.sin(a)];
      const yL=v.B, yR=R[1]+v.E;
      if(v.A>0&&v.F>0){pts.push([-v.A+v.F*s,yL-v.F*c]);segs.push(["F",v.F,[-0.6,0.8]])}
      if(v.A>0){pts.push([-v.A,yL]);segs.push(["A",v.A,[0,-1]])}
      pts.push([0,yL]);segs.push(["B",v.B,[-1,0]]);
      pts.push([0,0]);segs.push(["C",v.C,[-0.3,1]]);
      pts.push(V);segs.push(["D",v.D,[0.3,1]]);
      pts.push(R);segs.push(["E",v.E,[1,0]]);
      pts.push([R[0],yR]);
      if(v.G>0){segs.push(["G",v.G,[0,-1]]);pts.push([R[0]+v.G,yR])}
      if(v.G>0&&v.F>0){segs.push(["F",v.F,[0.6,0.8]]);pts.push([R[0]+v.G-v.F*s,yR-v.F*c])}
      return {pts,segs,dob:segs.filter(s=>s[1]>0).length-1};
    }
  },
  "pingadeira-rufo-inclinado":{
    nome:"Pingadeira com rufo (inclinado)",
    campos:[["A","Pingadeira",4],["B","Topo",15],["C","Rufo inclinado",15],["D","Aba descendo",6],["F","Bainha",1.5],["ang","Inclinação rufo (°)",40]],
    perfil(v){
      const s=Math.sin(rad(20)),c=Math.cos(rad(20)),a=rad(Math.min(v.ang,89)),pts=[],segs=[];
      if(v.A>0&&v.F>0){pts.push([v.F*s,-v.A+v.F*c]);segs.push(["F",v.F,[0.8,0.6]])}
      if(v.A>0){pts.push([0,-v.A]);segs.push(["A",v.A,[-1,0]])}
      pts.push([0,0]);segs.push(["B",v.B,[0,-1]]);
      pts.push([v.B,0]);segs.push(["C",v.C,[0.6,-0.8]]);
      const P=[v.B+v.C*Math.cos(a),-v.C*Math.sin(a)];pts.push(P);
      if(v.D>0){segs.push(["D",v.D,[1,0]]);pts.push([P[0],P[1]-v.D])}
      return {pts,segs,dob:segs.filter(s=>s[1]>0).length-1};
    }
  }
};

let cur=(location.hash.slice(1) in PIECES)?location.hash.slice(1):"platibanda";

function renderTabs(){
  $("tabs").innerHTML=Object.entries(PIECES).map(([k,p])=>`<button data-k="${k}" aria-pressed="${k===cur}">${p.nome}</button>`).join("");
}
function renderFields(){
  const p=PIECES[cur];
  $("fields").innerHTML=p.campos.map(([k,l,d])=>{
    const tag=k.length===1?`<span class="tag">${k}</span>`:"";
    return `<div class="f"><label for="f-${cur}-${k}">${tag}${l}</label><input id="f-${cur}-${k}" data-k="${k}" type="number" step="0.5" min="0" value="${d}"></div>`;
  }).join("")+`<div class="f"><label for="f-${cur}-len">Comprimento</label><input id="f-${cur}-len" data-k="len" type="number" step="10" min="10" value="100"></div>`;
  $("fields").querySelectorAll("input").forEach(i=>i.addEventListener("input",update));
}
function vals(){const o={};$("fields").querySelectorAll("input").forEach(i=>{o[i.dataset.k]=Math.max(0,parseFloat(i.value)||0)});o.len=Math.max(1,o.len);return o}

// ---------- 3D ----------
const canvas=$("c"), stage=canvas.parentElement;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(35,1,1,5000);
const ctl=new THREE.OrbitControls(cam,canvas); ctl.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x667788,0.75));
const sun=new THREE.DirectionalLight(0xffffff,0.9); sun.position.set(80,140,120); scene.add(sun);
const fill=new THREE.DirectionalLight(0xffffff,0.35); fill.position.set(-100,40,-80); scene.add(fill);
const mat=new THREE.MeshStandardMaterial({color:0xb8c0c6,metalness:0.55,roughness:0.38,side:THREE.DoubleSide});
const edgeMat=new THREE.LineBasicMaterial({color:0x3a444b});
let group=new THREE.Group(); scene.add(group);
let center=new THREE.Vector3(), radius=50;

function build(pts,L){
  const t=0.2;
  scene.remove(group); group.traverse(o=>{o.geometry&&o.geometry.dispose()});
  group=new THREE.Group();
  for(let i=0;i<pts.length-1;i++){
    const [x1,y1]=pts[i],[x2,y2]=pts[i+1];
    const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy); if(l<0.01)continue;
    const g=new THREE.BoxGeometry(l+t,t,L);
    const m=new THREE.Mesh(g,mat);
    m.position.set((x1+x2)/2,(y1+y2)/2,0); m.rotation.z=Math.atan2(dy,dx);
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g),edgeMat)); group.add(m);
  }
  scene.add(group);
  const box=new THREE.Box3().setFromObject(group);
  box.getCenter(center); radius=box.getSize(new THREE.Vector3()).length()/2;
  ctl.target.copy(center);
}
function viewIso(){cam.position.set(center.x+radius*1.3,center.y+radius*0.9,center.z+radius*1.6);ctl.update()}
function viewFront(){cam.position.set(center.x,center.y,center.z+radius*2.6);ctl.update()}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);
(function loop(){requestAnimationFrame(loop);ctl.update();renderer.render(scene,cam)})();

// ---------- Seção 2D ----------
function drawSection(r){
  const {pts,segs}=r, svg=$("sec");
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const W=320,H=210,pad=36,s=Math.min((W-2*pad)/Math.max(maxX-minX,1),(H-2*pad)/Math.max(maxY-minY,1));
  const ox=(W-(maxX-minX)*s)/2-minX*s, oy=(H+(maxY-minY)*s)/2+minY*s;
  const P=([x,y])=>[ox+x*s,oy-y*s];
  const fg=css("--fg"),dim=css("--dim"),mu=css("--muted");
  let h=`<polyline points="${pts.map(p=>P(p).join(",")).join(" ")}" fill="none" stroke="${fg}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  for(let i=0;i<pts.length-1;i++){
    const [k,val,n]=segs[i]; if(!k)continue;
    const [a,b]=[P(pts[i]),P(pts[i+1])],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
    h+=`<text x="${mx+n[0]*20}" y="${my+n[1]*16+4}" text-anchor="middle" font-size="12" fill="${dim}" font-weight="600">${k} ${fmt(val,val%1?1:0)}</text>`;
  }
  if(r.ang!==undefined){const [x0,y0]=P([0,0]);h+=`<text x="${x0}" y="${y0-14}" text-anchor="middle" font-size="11" fill="${mu}">${fmt(r.ang,0)}° / ${fmt(180-2*r.ang,0)}° abertura</text>`}
  h+=`<text x="${W-6}" y="${H-6}" text-anchor="end" font-size="10" fill="${mu}">cm</text>`;
  svg.innerHTML=h;
}

let last=null, firstView=true;
function update(){
  const v=vals(), r=PIECES[cur].perfil(v); last=r;
  const dev=r.segs.reduce((a,s)=>a+s[1],0);
  $("rDev").textContent=fmt(dev)+" cm";
  $("rArea").textContent=fmt(dev/100*v.len/100,2)+" m²";
  $("rDob").textContent=r.dob;
  drawSection(r); build(r.pts,v.len);
  if(firstView){viewIso();firstView=false}
}
function select(k){
  cur=k; try{history.replaceState(null,"","#"+k)}catch(e){}
  renderTabs(); renderFields(); firstView=true; update();
}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)select(b.dataset.k)});
addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(k in PIECES&&k!==cur)select(k)});
$("vIso").onclick=viewIso; $("vFront").onclick=viewFront;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>last&&drawSection(last));
resize(); select(cur);
</script>
</body>
